openapi: 3.0.3
info:
  title: Samsung PRISM Worklet Management System API
  description: |
    Comprehensive API documentation for the Samsung PRISM Worklet Management System.
    
    ## Overview
    A full-stack platform for managing academic worklets, facilitating mentor-student collaboration,
    and tracking research outcomes including publications, patents, and commercializations.
    
    ## Authentication
    All protected endpoints require JWT Bearer token authentication.
    - Access Token: 30 minutes validity
    - Refresh Token: 7 days validity
    
    ## Base URL
    - Development: http://localhost:8000
    - Production: TBD
    
    ## Rate Limiting
    - Auth endpoints: 30 requests per minute per IP
    
    ## Features
    - Multi-role access control (Admin, Mentor, Professor, Student)
    - OTP-based email verification
    - Worklet lifecycle management
    - Milestone tracking with dual feedback (mentor + professor)
    - Suggestions and feedback system
    - Portfolio management (papers, patents, achievements, commercializations)
    - Meeting scheduling and management
    - Dashboard analytics
    
  version: 1.0.0
  contact:
    name: Samsung PRISM Team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Development server
  - url: http://localhost:8000/api
    description: API versioned endpoint (future)

tags:
  - name: Auth
    description: Authentication and authorization endpoints
  - name: Health
    description: Health check and system status
  - name: Worklets
    description: Worklet management and CRUD operations
  - name: Dashboard
    description: Analytics and statistics
  - name: Evaluations
    description: Mentor evaluations and performance tracking
  - name: Associations
    description: User-worklet associations and relationships
  - name: Portfolio
    description: Publications, patents, achievements, commercializations
  - name: Suggestions
    description: Mentor-student feedback and suggestions
  - name: Milestones
    description: Student milestone tracking and reviews
  - name: Meetings
    description: Meeting scheduling and management
  - name: Colleges
    description: College management and statistics

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login

  schemas:
    # ==================== Auth Schemas ====================
    RequestOTP:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: student@example.com
    
    VerifyOTP:
      type: object
      required:
        - email
        - otp_code
      properties:
        email:
          type: string
          format: email
        otp_code:
          type: string
          pattern: '^\d{6}$'
          example: "123456"
    
    SetPassword:
      type: object
      required:
        - email
        - name
        - role
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [Admin, Mentor, Professor, Student]
        password:
          type: string
          minLength: 8
          description: Must be at least 8 characters
    
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [Admin, Mentor, Professor, Student]
          description: Optional role filter
    
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer
        user:
          $ref: '#/components/schemas/UserResponse'
    
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    
    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8

    # ==================== User Schemas ====================
    UserResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Admin, Mentor, Professor, Student]
        team:
          type: string
          nullable: true
        college:
          type: string
          nullable: true
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ==================== Worklet Schemas ====================
    WorkletCreate:
      type: object
      required:
        - title
        - start_date
        - end_date
      properties:
        title:
          type: string
          minLength: 3
        cert_id:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        problem_statement:
          type: string
          nullable: true
        expectation:
          type: string
          nullable: true
        prerequisites:
          type: string
          nullable: true
        status:
          type: string
          enum: [To Start, Ongoing, Completed, On Hold, Dropped]
          default: Ongoing
        domain:
          type: integer
          description: TechDomain ID
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        college_id:
          type: integer
          nullable: true
    
    WorkletUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [To Start, Ongoing, Completed, On Hold, Dropped]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        github_url:
          type: string
          format: uri
        performance:
          type: string
          enum: [Very Good, Good, Average, Poor, NA]
        risk_status:
          type: integer
          enum: [0, 1, 2, 3]
          description: 0=NA/Grey, 1=High/Red, 2=Medium/Amber, 3=Safe/Green
    
    WorkletResponse:
      type: object
      properties:
        id:
          type: integer
        cert_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        github_url:
          type: string
        domain:
          type: string
        team:
          type: string
        college_name:
          type: string
        student_count:
          type: integer
        students:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              email:
                type: string
        created_at:
          type: string
          format: date-time
        performance:
          type: string
        risk_status:
          type: integer

    # ==================== Association Schemas ====================
    UserWorkletAssociationCreate:
      type: object
      required:
        - user_id
        - worklet_id
        - role_in_worklet
      properties:
        user_id:
          type: integer
        worklet_id:
          type: integer
        role_in_worklet:
          type: string
          enum: [Mentor, Student, Professor]
    
    WorkletWithAssociations:
      type: object
      properties:
        worklet:
          $ref: '#/components/schemas/WorkletResponse'
        mentors:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        students:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        professors:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'

    # ==================== Evaluation Schemas ====================
    EvaluationSubmit:
      type: object
      required:
        - worklet_id
      properties:
        worklet_id:
          type: integer
        performance_rating:
          type: string
          enum: [poor, average, good, very_good, excellent, outstanding]
        completion_quality:
          type: string
          enum: [poor, average, good, very_good, excellent]
        innovation_score:
          type: integer
          minimum: 1
          maximum: 10
        teamwork_rating:
          type: string
          enum: [needs_improvement, average, good, excellent]
        perks:
          type: object
          properties:
            points_awarded:
              type: integer
              default: 0
            certificate_type:
              type: string
            recommendation_letter:
              type: boolean
              default: false
            internship_opportunity:
              type: boolean
              default: false
            bonus_credits:
              type: integer
              default: 0
            special_recognition:
              type: string
            mentorship_extension:
              type: boolean
              default: false
        comments:
          type: string
        feedback:
          type: string
        evaluated_by:
          type: string
          format: email
        evaluation_date:
          type: string
          format: date-time

    # ==================== Portfolio Schemas ====================
    AchievementCreate:
      type: object
      required:
        - title
        - type
      properties:
        title:
          type: string
        description:
          type: string
        year:
          type: integer
        type:
          type: string
          enum: [Award, Recognition, Other]
        link:
          type: string
        worklet_id:
          type: integer
          nullable: true
    
    PaperCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        publication_year:
          type: integer
        journal:
          type: string
        doi:
          type: string
        link:
          type: string
        worklet_id:
          type: integer
          nullable: true
    
    PatentCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        application_number:
          type: string
        filing_year:
          type: integer
        status:
          type: string
          enum: [Filed, Granted, Pending]
        link:
          type: string
        worklet_id:
          type: integer
          nullable: true
    
    CommercializationCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        year:
          type: integer
        revenue:
          type: number
          format: decimal
        company:
          type: string
        link:
          type: string
        worklet_id:
          type: integer
          nullable: true

    # ==================== Suggestion Schemas ====================
    SuggestionCreate:
      type: object
      required:
        - worklet_id
        - suggestion_title
        - suggestion_content
      properties:
        worklet_id:
          type: integer
        suggestion_title:
          type: string
        suggestion_content:
          type: string
        category:
          type: string
          default: General
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
    
    SuggestionUpdate:
      type: object
      properties:
        is_read:
          type: boolean
        is_helpful:
          type: boolean
        student_response:
          type: string
    
    SuggestionOut:
      type: object
      properties:
        suggestion_id:
          type: integer
        worklet_id:
          type: integer
        mentor_id:
          type: integer
        mentor_name:
          type: string
        mentor_email:
          type: string
        suggestion_title:
          type: string
        suggestion_content:
          type: string
        category:
          type: string
        priority:
          type: string
        is_read:
          type: boolean
        is_helpful:
          type: boolean
        student_response:
          type: string
        response_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ==================== Milestone Schemas ====================
    MilestoneCreate:
      type: object
      required:
        - worklet_id
        - milestone_type
      properties:
        worklet_id:
          type: integer
        milestone_type:
          type: string
          example: First Review
        date_created:
          type: string
          format: date-time
        field1_label:
          type: string
        field1_value:
          type: string
        field2_label:
          type: string
        field2_value:
          type: string
        toggle_label:
          type: string
        toggle_value:
          type: boolean
        attachment_name:
          type: string
        attachment_size:
          type: integer
        attachment_type:
          type: string
        attachment_url:
          type: string
    
    MilestoneFeedbackCreate:
      type: object
      required:
        - milestone_id
        - reviewer_role
        - feedback_content
      properties:
        milestone_id:
          type: integer
        reviewer_role:
          type: string
          enum: [Mentor, Professor]
        feedback_content:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
    
    MilestoneOut:
      type: object
      properties:
        milestone_id:
          type: integer
        worklet_id:
          type: integer
        student_id:
          type: integer
        student_name:
          type: string
        student_email:
          type: string
        milestone_type:
          type: string
        date_created:
          type: string
          format: date-time
        field1_label:
          type: string
        field1_value:
          type: string
        field2_label:
          type: string
        field2_value:
          type: string
        toggle_label:
          type: string
        toggle_value:
          type: boolean
        attachment_name:
          type: string
        attachment_url:
          type: string
        feedbacks:
          type: array
          items:
            $ref: '#/components/schemas/MilestoneFeedbackOut'
    
    MilestoneFeedbackOut:
      type: object
      properties:
        feedback_id:
          type: integer
        milestone_id:
          type: integer
        reviewer_id:
          type: integer
        reviewer_name:
          type: string
        reviewer_email:
          type: string
        reviewer_role:
          type: string
        feedback_content:
          type: string
        rating:
          type: integer
        feedback_date:
          type: string
          format: date-time

    # ==================== Meeting Schemas ====================
    MeetingCreate:
      type: object
      required:
        - title
        - scheduled_date
        - start_time
        - duration_minutes
        - worklet_ids
      properties:
        title:
          type: string
        description:
          type: string
        scheduled_date:
          type: string
          format: date
        start_time:
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "14:30"
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 480
        meeting_link:
          type: string
          format: uri
        worklet_ids:
          type: array
          items:
            type: integer
          minItems: 1
        is_recurring:
          type: boolean
          default: false
        recurrence:
          type: object
          properties:
            frequency:
              type: string
              enum: [daily, weekly, monthly]
            interval:
              type: integer
              minimum: 1
            end_date:
              type: string
              format: date
    
    MeetingUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [upcoming, live, completed, cancelled]
        meeting_link:
          type: string
        notes:
          type: string
    
    MeetingOut:
      type: object
      properties:
        meeting_id:
          type: integer
        organizer_id:
          type: integer
        organizer_name:
          type: string
        title:
          type: string
        description:
          type: string
        scheduled_datetime:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        meeting_link:
          type: string
        status:
          type: string
        worklets:
          type: array
          items:
            type: object
            properties:
              worklet_id:
                type: integer
              title:
                type: string
              scheduled_start:
                type: string
                format: date-time
        participants:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        created_at:
          type: string
          format: date-time

    # ==================== College Schemas ====================
    CollegeOut:
      type: object
      properties:
        college_id:
          type: integer
        college_name:
          type: string
        location:
          type: string
        established:
          type: integer
        infrastructure:
          type: string
        area_of_expertise:
          type: string
        workletCount:
          type: integer
        veryGoodCount:
          type: integer
        goodCount:
          type: integer
        averageCount:
          type: integer
        poorCount:
          type: integer
        completedCount:
          type: integer
        ongoingCount:
          type: integer
        onHoldCount:
          type: integer
        terminatedCount:
          type: integer
        totalStudents:
          type: integer

    # ==================== Dashboard Schemas ====================
    DashboardStatistics:
      type: object
      properties:
        total_worklets:
          type: integer
        completed_worklets:
          type: integer
        ongoing_worklets:
          type: integer
        total_mentors:
          type: integer
        total_students:
          type: integer
        total_professors:
          type: integer
        publications:
          type: integer
        patents:
          type: integer

    # ==================== Error Response ====================
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
        status_code:
          type: integer

paths:
  # ==================== Health Check ====================
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is running
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: Samsung PRISM Backend

  # ==================== Authentication ====================
  /auth/request-otp:
    post:
      tags:
        - Auth
      summary: Request OTP for registration
      description: Send OTP to email for new user registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTP'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP sent successfully to your email.
        '400':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-otp:
    post:
      tags:
        - Auth
      summary: Verify OTP
      description: Verify the OTP sent to email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP verified. Please set your password.
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/set-password:
    post:
      tags:
        - Auth
      summary: Set password after OTP verification
      description: Complete registration by setting password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          description: OTP not verified or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Login with email and password to get JWT tokens
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Get new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Get currently authenticated user information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Send password reset link to email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: Reset password using token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== Worklets ====================
  /worklets/:
    get:
      tags:
        - Worklets
      summary: List all worklets
      description: Get list of all worklets with optional year filtering
      parameters:
        - name: year
          in: query
          description: Filter by year (checks if worklet was active in this year)
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of worklets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkletResponse'
    
    post:
      tags:
        - Worklets
      summary: Create new worklet
      description: Create a new worklet (Mentor/Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkletCreate'
      responses:
        '201':
          description: Worklet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkletResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /worklets/{worklet_id}:
    get:
      tags:
        - Worklets
      summary: Get worklet by ID
      description: Get detailed information about a specific worklet
      parameters:
        - name: worklet_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Worklet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkletResponse'
        '404':
          description: Worklet not found
          content:
            application/json:
              schema:
