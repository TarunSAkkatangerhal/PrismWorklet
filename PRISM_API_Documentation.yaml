# ==================== Additional Information ====================
externalDocs:
  description: Samsung PRISM GitHub Repository
  url: https://github.com/samsung/prism

x-api-design-principles:
  - RESTful architecture
  - JWT authentication with refresh tokens
  - Role-based access control
  - Comprehensive error handling
  - Rate limiting on authentication endpoints
  - Database connection pooling
  - Email notifications for key events
  - Auto-increment milestone progress after 2 days

x-database-schema:
  tables:
    - users (multi-role: Admin, Mentor, Professor, Student)
    - user_profiles (extended user information)
    - Prism_Worklet (research projects)
    - user_worklet_association (many-to-many relationships)
    - colleges (academic institutions)
    - evaluations (mentor evaluations)
    - suggestions (feedback system)
    - milestones (student milestones)
    - milestone_feedback (dual-role reviews)
    - meetings (meeting scheduling)
    - achievements (awards, recognitions)
    - papers (publications)
    - patents (patent filings)
    - commercializations (product commercializations)

x-technical-stack:
  backend:
    - FastAPI 0.104+
    - Python 3.11+
    - SQLAlchemy 2.0+
    - PyMySQL
    - Redis (OTP caching)
    - JWT (python-jose)
    - Passlib (password hashing with Argon2/bcrypt)
  frontend:
    - React 18
    - TypeScript
    - Tailwind CSS
    - Axios
  database:
    - MySQL 8
  deployment:
    - Docker
    - Docker Compose

x-security-features:
  - OTP-based registration
  - JWT access and refresh tokens
  - Password hashing (Argon2/bcrypt)
  - Rate limiting
  - Input sanitization
  - CORS configuration
  - Role-based authorization

x-notification-system:
  - Email notifications for:
    - OTP verification
    - Password reset
    - New milestone submissions
    - Meeting scheduling
    - Meeting cancellations
    - Worklet status updates
